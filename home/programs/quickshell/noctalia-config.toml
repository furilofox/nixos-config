[bar.default]
background_opacity = 0.59999998658895493
capsule_thickness = 0.72999998740851879
end = [ "tray", "notifications", "clipboard", "volume", "control-center" ]
margin_edge = 6
margin_ends = 6
radius = 4
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "media" ]
widget_spacing = 12

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 1081.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"

[wallpaper]
directory = "/home/fabian/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/fabian/Pictures/wallpapers/city-on-water.png"

    [wallpaper.last]
    path = "/home/fabian/Pictures/wallpapers/city-on-water.png"

    [wallpaper.monitors.DP-2]
    path = "/home/fabian/Pictures/wallpapers/city-on-water.png"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/fabian/Pictures/wallpapers/city-on-water.png"
